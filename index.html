
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LinkedIn Post Generator</title>
<style>
body{font-family:Arial;background:#f0f2f5;padding:20px}
.box{max-width:500px;background:white;margin:auto;padding:20px;border-radius:15px}
h2{color:#0077b5;text-align:center}
input,select{width:100%;padding:12px;margin:10px 0;border-radius:8px;border:1px solid #ccc}
button{width:100%;padding:12px;background:#0077b5;color:white;border:none;border-radius:8px;font-weight:bold}
#output{margin-top:15px;background:#eef7ff;padding:15px;border-radius:8px;display:none;white-space:pre-wrap}
</style>
</head>
<body>
<div class="box">
<h2>LinkedIn Post Generator</h2>
<input id="topic" placeholder="Topic likho">
<select id="tone"><option>Professional</option><option>Friendly</option></select>
<button onclick="generate()">Generate Post</button>
<div id="output"></div>
</div>
<script>
function generate(){
let t=document.getElementById('topic').value;
if(!t){alert('Topic likho');return;}
let o=document.getElementById('output');
o.style.display='block';
o.innerText='🚀 '+t+'\n\nIn today world '+t+' is future.\n\n👉 Innovation is key\n\nWhat do you think about '+t+'? #LinkedIn';
}
</script>
</body>
</html>
